name: test
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        jdk: ['11', '17', '21', '25', '27']
        os: ['ubuntu', 'windows']

    name: clj ${{ matrix.os }} jdk ${{ matrix.jdk }}

    runs-on: ${{ matrix.os }}-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/shared-setup
        with:
          jdk: ${{ matrix.jdk }}

      - name: run unit tests
        run: bb test-clj --clojure-version all --exclude :integration --exclude :gradle

      - name: run integration tests
        run: bb test-clj --include :integration

  test-gradle:
    strategy:
      matrix:
        jdk: ['11', '17', '21', '25', '27']
        gradle: ['8.14.6', '9.8.1']
        os: ['ubuntu', 'windows']
        exclude:
          - {gradle: '9.8.1', jdk: '11'}
          - {gradle: '8.14.6', jdk: '25'}
          - {gradle: '8.14.6', jdk: '27'}

    name: gradle ${{ matrix.gradle }} ${{ matrix.os }} jdk ${{ matrix.jdk }}

    runs-on: ${{ matrix.os }}-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/shared-setup
        with:
          jdk: ${{ matrix.jdk }}

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: run gradle tests
        run: bb test-clj --clojure-version all --include :gradle

  test-bb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/shared-setup

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'

      - name: run unit tests
        run: bb test-bb
