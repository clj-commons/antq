name: lint
on:
  # allow this workflow to be called from other workflows, namely: publish
  workflow_call:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  clj-kondo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/shared-setup

      - run: bb lint-kondo

  cljstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/shared-setup

      - run: bb lint-cljstyle check --report -v

  eastwood:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/shared-setup

      - run: bb lint-eastwood

  custom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/shared-setup

      # some of our tests don't need OS/JDK matrix coverage and act as checks/lints
      - run: bb test-clj --include :lint
