name: lint
on: [push, pull_request]

jobs:
  clj-kondo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/shared-setup

      - run: bb lint-kondo

  cljstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/shared-setup

      - run: bb lint-cljstyle check --report -v
